<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post Preview</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #222;
      --muted: #666;
      --line: #d8d8d8;
      --card: #fff;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap {
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
      text-align: center;
    }
    .card { max-width: 520px; }
    .icon {
      width: 132px;
      height: 176px;
      margin: 0 auto 36px;
      border: 3px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      position: relative;
      box-sizing: border-box;
    }
    .icon:before {
      content: "";
      position: absolute;
      width: 64px;
      height: 64px;
      border: 3px solid var(--line);
      border-radius: 50%;
      left: 31px;
      top: 30px;
    }
    .icon:after {
      content: "";
      position: absolute;
      width: 76px;
      height: 12px;
      background: var(--line);
      border-radius: 999px;
      left: 25px;
      bottom: 38px;
      box-shadow: 0 24px 0 var(--line);
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.05;
      font-weight: 700;
    }
    p {
      margin: 0;
      font-size: clamp(20px, 4vw, 34px);
      line-height: 1.3;
      color: var(--muted);
    }
    .foot {
      margin-top: 36px;
      font-size: clamp(14px, 2.8vw, 20px);
      color: #888;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Post preview placeholder">
      <div class="icon" aria-hidden="true"></div>
      <h1>Post preview</h1>
      <p>Select a post from the chart to view details.</p>
      <p class="foot">The preview will appear here after selection.</p>
    </section>
  </main>
</body>
</html>
